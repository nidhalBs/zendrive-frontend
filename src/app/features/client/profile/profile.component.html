<section class="page-content">
      <div class="container">
        <h1>Mon Profil</h1>
        <p class="text-muted mb-3">Gérez vos informations personnelles</p>

        <div class="profile-grid">
          <div class="card">
            <div class="card-body">
              <div class="profile-avatar">
                <div class="avatar-circle">{{user?.firstName?.charAt(0)}}{{user?.lastName?.charAt(0)}}</div>
                <h2>{{user?.firstName}} {{user?.lastName}}</h2>
                <p class="text-muted">{{user?.email}}</p>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><h3>Informations personnelles</h3></div>
            <div class="card-body">
              @if (successMsg) { <div class="alert-success">{{successMsg}}</div> }
              <div class="form-row">
                <div class="form-group"><label>Prénom</label><input class="form-control" [(ngModel)]="firstName"></div>
                <div class="form-group"><label>Nom</label><input class="form-control" [(ngModel)]="lastName"></div>
              </div>
              <div class="form-group"><label>Email</label><input class="form-control" type="email" [value]="user?.email" disabled></div>
              <div class="form-group"><label>Téléphone</label><input class="form-control" [(ngModel)]="phone"></div>
              <button class="btn btn-primary" (click)="updateProfile()">Enregistrer les modifications</button>
            </div>
          </div>
        </div>
      </div>
    </section>
