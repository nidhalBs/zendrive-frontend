<section class="auth-page">
      <div class="auth-card animate-fade-in">
        <div class="auth-header">
          <a routerLink="/" class="logo"><span class="logo-icon">Z</span><span>Zen<strong>Drive</strong></span></a>
          <h2>Connexion</h2>
          <p>Accédez à votre espace personnel</p>
        </div>
        @if (error) { <div class="alert alert-danger">{{error}}</div> }
        <div class="form-group">
          <label>Email</label>
          <input class="form-control" type="email" [(ngModel)]="email" placeholder="votre@email.com">
        </div>
        <div class="form-group">
          <label>Mot de passe</label>
          <input class="form-control" type="password" [(ngModel)]="password" placeholder="Votre mot de passe">
        </div>
        <button class="btn btn-primary btn-lg w-100" (click)="login()" [disabled]="loading">
          {{loading ? 'Connexion...' : 'Se connecter'}}
        </button>
        <p class="auth-link">Pas encore de compte ? <a routerLink="/auth/register">Créer un compte</a></p>
      </div>
    </section>
