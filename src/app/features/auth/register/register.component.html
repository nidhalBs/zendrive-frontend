<section class="auth-page">
      <div class="auth-card animate-fade-in">
        <div class="auth-header">
          <a routerLink="/" class="logo"><span class="logo-icon">Z</span><span>Zen<strong>Drive</strong></span></a>
          <h2>Créer un compte</h2>
          <p>Rejoignez ZenDrive pour une expérience premium</p>
        </div>
        @if (error) { <div class="alert alert-danger">{{error}}</div> }
        @if (success) { <div class="alert alert-success">{{success}}</div> }
        <div class="form-row">
          <div class="form-group"><label>Prénom</label><input class="form-control" [(ngModel)]="firstName" placeholder="Votre prénom"></div>
          <div class="form-group"><label>Nom</label><input class="form-control" [(ngModel)]="lastName" placeholder="Votre nom"></div>
        </div>
        <div class="form-group"><label>Email</label><input class="form-control" type="email" [(ngModel)]="email" placeholder="votre@email.com"></div>
        <div class="form-group"><label>Téléphone</label><input class="form-control" [(ngModel)]="phone" placeholder="+216 XX XXX XXX"></div>
        <div class="form-group"><label>Mot de passe</label><input class="form-control" type="password" [(ngModel)]="password" placeholder="Min. 8 caractères"></div>
        <div class="form-group"><label>Confirmer le mot de passe</label><input class="form-control" type="password" [(ngModel)]="confirmPassword" placeholder="Confirmez"></div>
        <button class="btn btn-primary btn-lg w-100" (click)="register()" [disabled]="loading">
          {{loading ? 'Création...' : 'Créer mon compte'}}
        </button>
        <p class="auth-link">Déjà inscrit ? <a routerLink="/auth/login">Se connecter</a></p>
      </div>
    </section>
