<section class="page-header">
      <div class="container">
        <h1>Contactez-nous</h1>
        <p>Notre équipe est à votre disposition pour répondre à toutes vos questions</p>
      </div>
    </section>

    <section class="contact-content">
      <div class="container">
        <div class="contact-grid">
          <div class="contact-info">
            <h2>Informations de Contact</h2>
            <div class="info-item">
              <div class="info-icon"><i class="material-icons">phone</i></div>
              <div><h4>Téléphone</h4><p>+216 XX XXX XXX</p></div>
            </div>
            <div class="info-item">
              <div class="info-icon"><i class="material-icons">email</i></div>
              <div><h4>Email</h4><p>contact&#64;zendrive.com</p></div>
            </div>
            <div class="info-item">
              <div class="info-icon"><i class="material-icons">location_on</i></div>
              <div><h4>Adresse</h4><p>Tunis, Tunisie</p></div>
            </div>
            <div class="info-item">
              <div class="info-icon"><i class="material-icons">schedule</i></div>
              <div><h4>Horaires</h4><p>24/7 - Service continu</p></div>
            </div>
          </div>

          <div class="contact-form card">
            <div class="card-body">
              <h2>Envoyez-nous un message</h2>
              <div class="form-row">
                <div class="form-group"><label>Nom</label><input class="form-control" placeholder="Votre nom"></div>
                <div class="form-group"><label>Email</label><input class="form-control" type="email" placeholder="Votre email"></div>
              </div>
              <div class="form-group"><label>Sujet</label><input class="form-control" placeholder="Sujet de votre message"></div>
              <div class="form-group"><label>Message</label><textarea class="form-control" rows="5" placeholder="Votre message..."></textarea></div>
              <button class="btn btn-primary btn-lg w-100"><i class="material-icons">send</i> Envoyer</button>
            </div>
          </div>
        </div>
      </div>
    </section>
